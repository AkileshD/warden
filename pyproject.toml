[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "warden"
version = "0.1.0"
description = "A fake shell that intercepts, evaluates, and deceives AI agent commands."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "textual",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "openai>=1.0.0",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daemon*", "clients*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
